spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.couchbase.CouchbaseAutoConfiguration
      - org.springframework.boot.autoconfigure.data.couchbase.CouchbaseDataAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  cloud:
    stream:
      enabled: false

# Placeholders for mandatory properties
SPRING_DATA_COUCHBASE_CONNECTION_STRING: localhost
SPRING_DATA_COUCHBASE_USERNAME: admin
SPRING_DATA_COUCHBASE_PASSWORD: password
SPRING_DATA_COUCHBASE_BUCKET_NAME: test
SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test
SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
SPRING_DATASOURCE_USERNAME: sa
SPRING_DATASOURCE_PASSWORD: ""
SPRING_RABBITMQ_USERNAME: user
SPRING_RABBITMQ_PASSWORD: password
